<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style-order.css">
	<link rel="stylesheet" href="css/normalize.css">
	<title>Order</title>
</head>

<body>
	<div class="central-wrapper" id="central-wrapper">
		<div class="outlet-wrapper">

			<header class="header">
				<div class="con__sticky" id="con__sticky" style="justify-content: start;">

					<div class="header__logo">
						<img src="" alt="Логотип" />
					</div>
					<div class="title" id="title-header" data-lang="title">
						Супер Іграшки
					</div>


				</div>

			</header>

			<main class="main" style="height: 600px;">
				<h1>Дякуємо за замовлення!</h1>

				<button class="turn-around" id="turn-around" onclick="BackToIndex()"> Продовжити покупки </button>

			</main>

			<footer class="footer">
				<div class="footer-top">
					<div class="social">
						<p>Ми в соціальних мережах</p>
						<div class="btn-social">
							<span class=" _icon-youtube" title="Youtube" aria-label="Youtube"></span>
							<span class="_icon-telegram" title="Telegram" aria-label="Telegram"></span>
							<span class="_icon-instagram" title="Instagram" aria-label="Instagram"></span>
							<span class="_icon-tik-tok" title="Tik-Tok" aria-label="Tik-Tok"></span></span>
							<span class="_icon-facebook" title="Facebook" aria-label="Facebook"></span>
						</div>
					</div>
					<div class="links">
						<p>Інформація про компанію</p>
						<div class="btn-links">
							<button>Про нас</button>
							<button>Умови використання сайту</button>
							<button>Контакти</button>
						</div>
					</div>
				</div>
				<div class="footer-bottom">
					<p>© 2025 Інтернет-магазин «Papluschins™» </p>
				</div>
			</footer>
		</div>

	</div>
	<script src="Js/orderJS/script.js"></script>

</body>

</html>
